[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "d4extract"
version = "0.1.0"
description = "Extract and convert Diablo IV model assets to glTF for Blender import"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pygltflib>=1.16",
    "platformdirs>=4.0",
]

[project.scripts]
d4extract = "d4extract.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
